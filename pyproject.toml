[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "electricity-vat-cut"
version = "0.1.0"
description = "Data pipeline for modelling the temporary VAT cut on domestic electricity (5% to 0%, October 2026 to March 2027)."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
  { name = "PolicyEngine" },
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "microdf-python>=1.2.0",
]

[project.optional-dependencies]
simulation = [
  # The [uk] extra exact-pins policyengine-uk and policyengine_core, so the
  # bundle version alone determines the whole simulation stack.
  "policyengine[uk]>=4.11.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
electricity-vat-cut-build = "electricity_vat_cut.cli:main"

[project.urls]
Homepage = "https://github.com/PolicyEngine/electricity-vat-cut"
Repository = "https://github.com/PolicyEngine/electricity-vat-cut"

[tool.hatch.build.targets.wheel]
packages = ["src/electricity_vat_cut"]

[tool.hatch.build.targets.sdist]
include = [
  "src/electricity_vat_cut/**/*.py",
  "tests/**/*.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
